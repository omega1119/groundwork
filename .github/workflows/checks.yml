name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  readme:
    name: README contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check every README against the contract
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name README.md -not -path "./templates/*" \
            -not -path "*/node_modules/*" -not -path "*/.venv/*")
          printf 'checking %d README file(s)\n' "${#files[@]}"
          test "${#files[@]}" -gt 0 || { echo "no README found"; exit 1; }
          python3 scripts/readme_check.py "${files[@]}"

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then python -m pip install -r requirements-dev.txt; fi

      - name: Lint
        run: |
          python -m pip install ruff==0.16.4
          ruff check .
          ruff format --check .

      - name: Test
        run: |
          if [ -d tests ]; then
            python -m pip install pytest
            python -m pytest -q
          else
            echo "no tests directory, skipping"
          fi
